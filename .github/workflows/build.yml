name: Build jar
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.2.0
      - name: Build
        run: gradle build --no-daemon
      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: nitro-client-jar
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar

      - name: Dump Minecraft signatures
        if: always()
        continue-on-error: true
        run: |
          mkdir -p dump
          find ~/.gradle -name '*.jar' -size +5M 2>/dev/null | grep -i 'yarn\|minecraft' | grep -vi 'sources' >
